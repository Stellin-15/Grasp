name: Feature request
description: Suggest an idea or a new language, framework, or pipeline to support.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to understand or do that Grasp does not help with yet?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed solution
