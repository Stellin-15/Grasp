[project]
name = "shop"
version = "0.4.0"
description = "Fixture: a small FastAPI shop service."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111",
  "SQLAlchemy[asyncio]~=2.0",
  "pydantic>=2.7",
  "PyYAML",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff", "mypy"]

[project.scripts]
shop = "shop.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
